[package]
name = "bevy_markup_fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.bevy_markup]
path = ".."
features = ["fuzzing"]


[[bin]]
name = "html"
path = "fuzz_targets/html.rs"
test = false
doc = false
bench = false

[[bin]]
name = "css"
path = "fuzz_targets/css.rs"
test = false
doc = false
bench = false

[[bin]]
name = "svg"
path = "fuzz_targets/svg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ftl"
path = "fuzz_targets/ftl.rs"
test = false
doc = false
bench = false

# MiniJinja 3.1.0 with six fixes not yet released upstream (UPSTREAM U56,
# U57, U59, U60, U62, U64): `bevy_markup/3.1.0` on nchashch/minijinja. Applies to this
# repository only, not to crates depending on bevy_markup. Drop it with the
# MiniJinja release that has them.
[patch.crates-io]
minijinja = { git = "https://github.com/nchashch/minijinja", branch = "bevy_markup/3.1.0" }
