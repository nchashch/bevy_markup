[package]
name = "bevy_markup_test_fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[dependencies]
bevy_markup = { path = "..", features = ["fuzzing"] }

[dev-dependencies]
serde = "1.0.229"
test-fuzz = "8.1"

# MiniJinja 3.1.0 with six fixes not yet released upstream (UPSTREAM U56,
# U57, U59, U60, U62, U64): `bevy_markup/3.1.0` on nchashch/minijinja. Applies to this
# repository only, not to crates depending on bevy_markup. Drop it with the
# MiniJinja release that has them.
[patch.crates-io]
minijinja = { git = "https://github.com/nchashch/minijinja", branch = "bevy_markup/3.1.0" }
