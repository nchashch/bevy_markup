<article class="page">
  <p class="deep">Descendant of the page</p>
  <div class="panel">
    <p class="deep">Descendant of a panel</p>
    <div class="inner">
      <p class="deep">Descendant of panel and inner</p>
      <p class="direct">Child of inner</p>
    </div>
    <p class="direct">Child of panel</p>
    <span class="direct">Child span, not a paragraph</span>
  </div>
  <section class="panel other">
    <p class="deep direct">Child of two-classed panel</p>
  </section>
  <p class="plain">Outside every panel</p>
</article>
