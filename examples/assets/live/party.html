<html class="screen">
<div class="panel">
  <h1 data-l10n-id="live-title">Party</h1>
  {% for unit in units %}
  <div class="unit{% if unit.low %} low{% endif %}" id="unit-{{ unit.name }}" style="opacity: {{ unit.opacity }}">
    <div class="badge" is="badge"></div>
    <div class="unit-body">
      <p data-l10n-id="live-unit" data-l10n-args='{"name": "{{ unit.name }}", "hp": {{ unit.hp }}}'>{{ unit.name }}: {{ unit.hp }} HP</p>
      <div class="bar"><div class="bar-fill{% if unit.low %} low{% endif %}" style="width: {{ unit.hp }}%"></div></div>
    </div>
  </div>
  {% endfor %}
  {% if units | length == 0 %}
  <p class="empty" data-l10n-id="live-empty">Nobody left. Press N.</p>
  {% endif %}
</div>
</html>
