<html class="stats-root">
<p data-l10n-id="live-stats" data-l10n-args='{"updates": {{ updates }}, "spawned": {{ spawned }}, "frames": {{ frames }}}'>{{ updates }} / {{ spawned }} / {{ frames }}</p>
<p class="hint" data-l10n-id="live-hint">Arrows / D-pad / left stick: move · Enter / A: press · N / X: recruit at the top · K / B: knock out the focused member (else the last) · L / Y: language</p>
</html>
