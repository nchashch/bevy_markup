{% include "components.html" %}
<html class="backdrop">
<div class="dialog">
  <p data-l10n-id="dialog-reset">Reset all settings?</p>
  <div class="dialog-buttons">
    {% <ui.button id="dialog-yes" signal="dialog" answer="yes"> %}<p data-l10n-id="dialog-yes">Reset</p>{% </ui.button> %}

  </div>
</div>
</html>
