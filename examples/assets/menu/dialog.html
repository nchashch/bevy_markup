{% import "../shared/components.html" as ui %}
<html class="backdrop">
<div class="dialog">
  <p data-l10n-id="dialog-reset">Reset all settings?</p>
  <div class="dialog-buttons">
    {% call ui.button(id="dialog-yes", signal="dialog", answer="yes") %}<p data-l10n-id="dialog-yes">Reset</p>{% endcall %}
    {% call ui.button(id="dialog-no", signal="dialog", answer="no", autofocus=true) %}<p data-l10n-id="dialog-no">Cancel</p>{% endcall %}
  </div>
</div>
</html>
