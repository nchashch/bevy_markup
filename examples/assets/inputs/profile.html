<h1 data-l10n-id="profile-title">Profile</h1>
<p class="hint" data-l10n-id="profile-hint">Click a field and type, or move between the fields with ↑ ↓ / D-pad. While a field has the focus, <kbd>←</kbd> <kbd>→</kbd> move the caret.</p>

<div class="field">
  <p class="label" data-l10n-id="profile-name-label">Name</p>
  <input type="text" id="name" value="{{ name }}" autofocus>
</div>
<div class="field">
  <p class="label" data-l10n-id="profile-title-label">Title</p>
  <input type="text" id="title" value="{{ title }}">
</div>

<p class="preview" data-l10n-id="profile-preview" data-l10n-args='{{ preview_args }}'>Typing: {{ live_name }} — {{ live_title }}</p>

<div class="actions">
  <p id="reset-name" class="action" data-on-click="reset-name" data-l10n-id="profile-reset-name">Reset name</p>
  <p id="reset-title" class="action" data-on-click="reset-title" data-l10n-id="profile-reset-title">Reset title</p>
</div>
