[package]
name = "bevy_markup_honggfuzz"
version = "0.0.0"
publish = false
edition = "2024"

[dependencies]
honggfuzz = "0.5"
bevy_markup = { path = "..", features = ["fuzzing"] }

[[bin]]
name = "html"
path = "targets/html.rs"
test = false
doc = false
bench = false

[[bin]]
name = "css"
path = "targets/css.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ftl"
path = "targets/ftl.rs"
test = false
doc = false
bench = false

[[bin]]
name = "svg"
path = "targets/svg.rs"
test = false
doc = false
bench = false

# Vendored (path) so the bundled C source can be patched for current
# binutils: bfd.h no longer defines TRUE/FALSE (see linux/bfd.c).
[patch.crates-io]
# MiniJinja 3.1.0 with five fixes not yet released upstream (UPSTREAM U56,
# U57, U59, U60, U62): `bevy_markup/3.1.0` on nchashch/minijinja. Applies to this
# repository only, not to crates depending on bevy_markup. Drop it with the
# MiniJinja release that has them.
minijinja = { git = "https://github.com/nchashch/minijinja", branch = "bevy_markup/3.1.0" }
honggfuzz = { path = "vendor/honggfuzz" }
