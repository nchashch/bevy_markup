[package]
name = "bevy_markup"
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Markdown+HTML templates (Tera), CSS and Fluent localization as native Bevy UI"
repository = "https://github.com/nchashch/bevy_markup"
readme = "README.md"
keywords = ["bevy", "ui", "html", "css", "localization"]
categories = ["game-development", "gui", "internationalization"]
# Developer-only material; not needed to use the crate.
exclude = [
    ".github/",
    "docs/agents/",
    "scripts/",
    "tests/golden/",
    "examples/screenshots/",
    "AGENTS.md",
]

[features]
# Parley falls back to installed system fonts per script (e.g. CJK, which the
# bundled fonts lack). An app decision, so opt-in.
system_fonts = ["bevy/system_font_discovery"]
# Exposes `bevy_markup::fuzz` (`#[doc(hidden)]`, not covered by semver): internal
# glue callable without a full Bevy app, for `fuzz/` targets.
fuzzing = ["dep:wgpu-types"]
# Dev/QA only: serves the examples over localhost BRP + MCP
# (bevy_mcp_harness), so an agent can playtest them — `game/screenshot`
# (the examples' README screenshots), `game/ui`, input mocks. Never enabled
# in a shipped build.
dev-tools = ["dep:bevy_mcp_harness"]
# `<input type="text">` maps to Bevy 0.20's editable-text widget
# (`EditableText` + `TextInput`); the widget crate isn't part of the
# crate's minimal `ui_api` bevy features, so it's opt-in.
text-input = ["bevy/bevy_ui_widgets", "bevy/keyboard"]
# Bevy's asset file watcher, for the `hot-reload` example (edit an asset
# file and the UI restyles without a restart — the library already reacts
# to `LoadedWithDependencies`/`Modified`). Inert otherwise; the library
# itself never needs it.
hot-reload = ["bevy/file_watcher"]
# Profiling with hotpath (https://hotpath.rs): the pipeline's systems and
# hot internals are instrumented; every macro is a no-op (and the crate
# compiles nothing) unless `hotpath` is on. `cargo run --example demo
# --features hotpath` prints a report on exit; `hotpath-alloc` adds
# per-function allocations. Never in `default`.
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]
hotpath-prometheus = ["hotpath/hotpath-prometheus"]
hotpath-cloud = ["hotpath/hotpath-cloud"]

[dependencies]
# Only what the library's code uses; the app picks rendering, windowing,
# platform and everything else. Check with `cargo check --lib`.
bevy = { version = "0.20.0", default-features = false, features = [
    # Node, ImageNode, Text/TextSpan (bevy_ui + bevy_text), assets, ECS.
    "ui_api",
    # Fallback when the CSS names no registered font family.
    "default_font",
    "bevy_log",
    # `data-on-*` interaction signals (bevy_picking events and hover map).
    "bevy_picking",
] }
# 9-slice style manifests (*.slice.ron).
ron = "0.12.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTML: Tera templating, then tl parsing.
tera = { version = "2.4.0", features = ["fast"] }
# astral-tl: astral-sh's maintained tl fork (same `tl` crate name). tl 0.7.8 drops the first
# character of the attribute after a value-less one (`autofocus data-on-click` →
# `ata-on-click`); see docs/agents/bugs/bug_0019.md and UPSTREAM.md.
tl = { package = "astral-tl", version = "0.8.0" }
# Localization: FTL syntax, bundle, formatting (https://projectfluent.org).
fluent = "0.16.0"
# Locale identifiers: the `*.ftl.ron` manifest's `locale` field.
unic-langid = { version = "0.9", features = ["serde"] }
# CSS. `into_owned`: parsed StyleSheet<'i> → StyleSheet<'static> for storing as an asset.
lightningcss = { version = "1.0.0-alpha.72", features = ["into_owned"] }
# Markdown as a source syntax (ADR 0014): `.md` templates and Markdown in
# Fluent values convert to the HTML the pipeline already parses. `html`
# renders to HTML; no CLI parser (`getopts`).
pulldown-cmark = { version = "0.13.3", default-features = false, features = ["html"] }
# The FTL AST (ADR 0020 Decision 3): the per-message Markdown patterns
# pre-convert at bundle load. fluent doesn't re-export it; same version as
# fluent's, patched below.
fluent-syntax = "0.11.1"
# Profiling instrumentation (the `hotpath*` features). Inert without them:
# no profiling code, no dependencies, macros expand to the plain function.
hotpath = "0.28"
# Only for the `fuzzing` harness: `Image::new_fill` needs wgpu texture types,
# which bevy_image does not re-export.
wgpu-types = { version = "30.0.1", optional = true }
# Only for the `dev-tools` feature: the examples' QA tool surface — localhost
# BRP + MCP (bevy_mcp_harness) so an agent can playtest the examples:
# `game/screenshot` (the examples' README screenshots), `game/ui`, input
# mocks. Inert unless enabled; the library itself never touches it. Same
# author as bevy_markup; bevy 0.20 only.
bevy_mcp_harness = { version = "0.4.0", optional = true }

[dev-dependencies]
arbtest = "0.3.2"
async-trait = "0.1.92"
# Examples are full apps: Bevy defaults (window, renderer, …) plus system
# font fallback so the demo's Japanese locale renders.
bevy = { version = "0.20.0", features = ["system_font_discovery", "debug"] }
# Pinned: proptest-stateful 0.1.3 needs the rand-0.8 TestRng of proptest
# ≤1.5, so every proptest-based dev crate must share that line.
proptest = "=1.5.0"
proptest-stateful = "0.1.3"
quickcheck = "1.1.0"
# Benchmarks (benches/pipeline.rs, ADR 0018): statistical harness with
# saved baselines and regression detection. default-features off drops the
# plotters/gnuplot machinery; html_reports keeps the browsable report.
criterion = { version = "0.8.2", default-features = false, features = ["html_reports"] }
# The second harness (ADR 0019, reinstated): allocation counts + bytes per
# benchmark — the direct signal for update-model work — run in parallel
# with criterion's statistics so the two corroborate each other.
divan = "0.1.21"
quickcheck_macros = "1.2.0"
# 0.4 requires proptest ≥1.6; 0.3.1 is the last line on ^1.1.
test-strategy = "0.3.1"

# Benchmarks (ADR 0018): criterion's own harness, not libtest's.
[[bench]]
name = "pipeline"
harness = false

# The second harness (ADR 0019): divan's, with allocation counting.
[[bench]]
name = "pipeline-divan"
harness = false

# The example needs Bevy's file watcher; skipped without the feature.
[[example]]
name = "hot-reload"
required-features = ["hot-reload"]

# Its `#[cfg(test)]` module (the board's content checks, plus the shared
# input module's) runs under plain `cargo test` — examples are built but
# not tested by default, so it never ran in CI (review_0003 R64).
[[example]]
name = "grid-names"
test = true

# fluent-syntax from the fork with fixes for two bugs reachable from any FTL
# asset (docs/agents/bugs/UPSTREAM.md U1, U2): a panic on an invalid unicode
# escape before a multi-byte character, and a stack overflow on deeply nested
# expressions. Branch fix/fuzzing-bugs-0.11 is upstream's fluent-syntax 0.11.1
# tag plus the fixes; 0.11 is what fluent 0.16's fluent-bundle requires.
# Cargo.lock pins the commit. Applies only inside this repository: crates
# depending on bevy_markup need the same entry (see README). The fuzz
# workspaces repeat it.
[patch.crates-io]
fluent-syntax = { git = "https://github.com/nchashch/fluent-rs", branch = "fix/fuzzing-bugs-0.11" }

# Mutation testing (scripts/mutants.sh, .github/workflows/mutants.yml).
# Every mutant rebuilds bevy_markup and relinks its test binaries: no debug info
# (it dominates Bevy link times) and optimized dependencies (faster tests;
# built once per target dir). Those runs also link Bevy dynamically
# (`--features bevy/dynamic_linking`) and build only the tests they run —
# measured ~35× faster per mutant than a default `cargo test --no-run`.
[profile.mutants]
inherits = "dev"
debug = false

[profile.mutants.package."*"]
opt-level = 3
