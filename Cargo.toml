[package]
name = "p23"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1", features = [
	"basis-universal",
	"ktx2",
	"bevy_dev_tools",
	# Parley falls back to system fonts per script (Japanese: none of the
	# bundled fonts have CJK glyphs).
	"system_font_discovery",
] }
bevy_enhanced_input = "0.26.0"
bevy_mod_outline = { git = "https://github.com/nchashch/bevy_mod_outline", branch = "fix/skinned-motion-outline" }
bevy_tui_texture = "0.3.5"
vleue_navigator = "0.16.0"
bevy_ahoy = "0.2.0"
bevy_seedling = "0.8"
audionimbus = { version = "0.16", features = ["bevy", "auto-install"] }
ron = "0.12.1"
ratatui = "0.30.2"
bevy_hanabi = "0.19.0"
bevy_asset_loader = { version = "0.27.0", features = [
	"standard_dynamic_assets",
] }
bevy_skein = "0.6.0"
avian3d = { version = "0.7.0", features = ["diagnostic_ui", "simd"] }
noiz = "0.5.0"
serde = { version = "1", features = ["derive"] }

bevy_fluent = "0.15"
fluent = "0.16.0"
fluent_content = "0.0.5"
tl = "0.7.8"
tera = { version = "2.4.0", features = ["fast"] }
serde_json = "1"
# `into_owned`: parsed StyleSheet<'i> → StyleSheet<'static> for storing as an asset.
lightningcss = { version = "1.0.0-alpha.72", features = ["into_owned"] }

[patch.crates-io]
gltf = { git = "https://github.com/nchashch/gltf", branch = "feat/khr_texture_basisu" }
