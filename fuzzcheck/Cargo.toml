[package]
name = "bevy_markup_fuzzcheck"
version = "0.0.0"
publish = false
edition = "2024"

[dependencies]
bevy_markup = { path = "..", features = ["fuzzing"] }

[dev-dependencies]
fuzzcheck = "0.13"

# Vendored: fuzzcheck_mutators_derive 0.13.0 uses let-chains but declares
# edition 2021, which no longer compiles; bumped to edition 2024.
[patch.crates-io]
# MiniJinja 3.1.0 with six fixes not yet released upstream (UPSTREAM U56,
# U57, U59, U60, U62, U64): `bevy_markup/3.1.0` on nchashch/minijinja. Applies to this
# repository only, not to crates depending on bevy_markup. Drop it with the
# MiniJinja release that has them.
minijinja = { git = "https://github.com/nchashch/minijinja", branch = "bevy_markup/3.1.0" }
fuzzcheck = { path = "vendor/fuzzcheck" }
fuzzcheck_mutators_derive = { path = "vendor/fuzzcheck_mutators_derive" }
fuzzcheck_common = { path = "vendor/fuzzcheck_common" }
