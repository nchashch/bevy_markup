[package]
name = "bevy_markup_fuzzcheck"
version = "0.0.0"
publish = false
edition = "2024"

[dependencies]
bevy_markup = { path = "..", features = ["fuzzing"] }

[dev-dependencies]
fuzzcheck = "0.13"

# Vendored: fuzzcheck_mutators_derive 0.13.0 uses let-chains but declares
# edition 2021, which no longer compiles; bumped to edition 2024.
[patch.crates-io]
fuzzcheck = { path = "vendor/fuzzcheck" }
fuzzcheck_mutators_derive = { path = "vendor/fuzzcheck_mutators_derive" }
fuzzcheck_common = { path = "vendor/fuzzcheck_common" }
fluent-syntax = { git = "https://github.com/nchashch/fluent-rs", branch = "fix/fuzzing-bugs-0.11" }
