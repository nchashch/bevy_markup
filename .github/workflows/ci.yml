# Per commit / PR: the verification rules from AGENTS.md (warning-free
# library, all targets and docs; all tests), plus the Fluent oracle's
# committed references being current. Slow or environment-sensitive checks
# (golden images, browser oracle drift, fuzzing, mutation testing) run on a
# schedule: see nightly.yml and mutants.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Bevy's debug info dominates target/ size and nothing is debugged here.
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  test:
    name: Build, test, docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space (full-Bevy test builds are large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install Bevy's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libfontconfig-dev
      - uses: dtolnay/rust-toolchain@stable
      # Saves the `dev` cache the nightly golden job restores (nightly.yml
      # mirrors this workflow's env for it).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
      - name: Library with minimal Bevy features
        run: cargo check --lib
      # The text-input mapping arms compile only under the feature (plain
      # checks never see them) and its tests are gated too.
      - name: Library with text-input
        run: cargo check --lib --features text-input
      # The fuzz harness compiles only under the feature and plain checks
      # never see it (bug_0105: a cascade API change broke it silently,
      # which would have left the nightly fuzz jobs unbuildable). A check
      # here fails fast; the full unit tests run further down.
      - name: Library with fuzzing
        run: cargo check --lib --features fuzzing
      - name: All targets
        run: cargo build --all-targets
      - name: Tests
        run: cargo test
      - name: Tests with text-input
        run: cargo test --features text-input
      # The hot-reload and demo dev-tools examples are gated behind those
      # features and skipped by --all-targets.
      - name: Gated examples compile
        run: cargo check --examples --features hot-reload,dev-tools,text-input
      # Example `#[cfg(test)]` modules (the hot-reload palette's
      # round trip through the committed stylesheet) don't run under
      # plain `cargo test` or `cargo check --examples`.
      - name: Example unit tests
        run: cargo test --example hot-reload --features hot-reload
      - name: Fuzz harness unit tests
        run: cargo test --lib --features fuzzing
      - name: Docs
        run: cargo doc --no-deps

  fluent-oracle:
    name: Fluent oracle references are current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Regenerate tests/vectors/*/fluent.html with @fluent/dom
        run: scripts/fluent_oracle.sh
      - name: Compare with the committed references
        run: |
          # Untracked files (a new vector committed without its generated
          # output) don't show in git diff — catch them too (tracked
          # modifications are `git diff`'s job; the generator line nightly
          # ignores must not defeat it).
          if [ -n "$(git ls-files --others --exclude-standard tests/vectors)" ] \
            || ! git diff --exit-code -- tests/vectors; then
            echo "::error::fluent.html is stale: run scripts/fluent_oracle.sh, review and commit the diff"
            exit 1
          fi
