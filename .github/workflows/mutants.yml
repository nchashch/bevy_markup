# Twice-weekly mutation testing (AGENTS.md Testing TODO 6), sharded so each job
# fits the runner's time limit. Informational: it never fails on surviving
# mutants (some are documented equivalents); survivors are listed in each
# shard's job summary and uploaded, to be triaged into tests or notes.
# `--in-place` mutates the disposable checkout (no tree copies, unlike
# scripts/mutants.sh locally). Fast settings as in scripts/mutants.sh: the
# `mutants` profile, dynamic Bevy, and only the tests that run get built
# (`--cargo-arg`; a build per mutant then takes seconds, so the one-time
# dependency build dominates each shard).
name: Mutants

on:
  schedule:
    - cron: "41 2 * * 0,3" # Sundays and Wednesdays
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: Mutants shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space (full-Bevy test builds are large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install Bevy's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libfontconfig-dev
      - uses: dtolnay/rust-toolchain@stable
      # Restores the `mutants` cache cache.yml builds (env must stay equal).
      - id: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mutants
          save-if: false
      - name: Warn on a build-cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "::warning::no exact 'mutants' build cache (dependencies or toolchain changed since cache.yml last ran, or this job's env differs from cache.yml's); building from scratch"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Mutate and test (unit tests, vectors and oracles, state machine)
        run: |
          status=0
          cargo mutants --in-place --shard ${{ matrix.shard }}/4 \
            --profile mutants --cargo-arg=--features=bevy/dynamic_linking \
            -e src/fuzz.rs -e src/lib.rs \
            --cargo-arg=--lib --cargo-arg=--test=html_ui --cargo-arg=--test=stateful \
            --minimum-test-timeout 120 -o target || status=$?
          echo "cargo mutants exit status: $status"
          # 0: all caught; 2: survivors; 3: timeouts. Anything else is a setup error.
          case $status in 0|2|3) ;; *) exit "$status" ;; esac
      - name: Summarize survivors
        if: always()
        run: |
          {
            echo "### Mutants shard ${{ matrix.shard }}/4"
            for kind in missed timeout; do
              file=target/mutants.out/$kind.txt
              if [ -s "$file" ]; then
                echo "**$kind** ($(wc -l < "$file")):"
                echo '```'
                cat "$file"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: target/mutants.out/
          if-no-files-found: ignore
